components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login or registration

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        userName:
          type: string
          example: JohnDoe
        currentLocation:
          type: string
          nullable: true
          example: New York, NY
        bio:
          type: string
          nullable: true
          example: Software developer and basketball enthusiast
        categories:
          type: array
          items:
            type: string
          example: ["basketball", "programming", "reading"]
        createdAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-02-11T10:30:00.000Z'

    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: basketball

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: An error occurred

    